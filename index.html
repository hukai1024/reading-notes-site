<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读记录与书籍复盘</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif; background:#f7f5ef; color:#1f2933; }
    .wrap { max-width: 960px; margin:0 auto; padding:28px 18px 64px; }
    .hero { background:linear-gradient(135deg,#78350f,#1f2937); color:white; padding:30px; border-radius:24px; box-shadow:0 14px 32px rgba(31,41,55,.18); }
    h1 { margin:0 0 10px; font-size:34px; }
    .hero p { margin:6px 0; line-height:1.7; }
    .muted { color:rgba(255,255,255,.82); font-size:14px; }
    .section { margin-top:22px; background:white; border-radius:20px; padding:22px; box-shadow:0 8px 24px rgba(31,41,55,.08); }
    h2 { margin-top:0; }
    .hint { color:#667085; line-height:1.7; }
    .book-list { display:grid; gap:14px; }
    .book-card { border:1px solid #eee4d5; border-radius:18px; padding:16px; display:grid; grid-template-columns:1fr auto; gap:14px; background:white; align-items:center; }
    .book-card.done { border-color:#3b82f6; background:#eff6ff; }
    .book-card.reviewed { border-color:#16a34a; background:#f0fdf4; }
    .book-title { font-size:22px; font-weight:850; margin-bottom:8px; }
    .book-meta,.book-links { color:#667085; line-height:1.8; }
    a { color:#1455d9; text-decoration:none; font-weight:650; }
    a:hover { text-decoration:underline; }
    .book-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    button { border:1px solid #d7dce8; background:white; border-radius:999px; padding:9px 12px; font-size:15px; cursor:pointer; color:#344054; }
    button.active { color:white; border-color:transparent; }
    button[data-status="done"].active { background:#3b82f6; }
    button[data-status="reviewed"].active { background:#16a34a; }
    @media(max-width:640px) { h1 { font-size:28px; } .book-card { grid-template-columns:1fr; } .book-actions { justify-content:flex-start; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>阅读记录与书籍复盘</h1>
      <p>读完一本书后，沉淀成可反复阅读的知识提炼。</p>
      <p class="muted">最后同步：2026-05-27 17:42</p>
    </section>
    <section class="section">
      <h2>书籍列表</h2>
      <p class="hint">这里收纳已经读完的书。状态只保存在当前浏览器本地缓存里，不会上传。</p>
      <div class="book-list">
        
        <article class="book-card" data-key="2026-shui-ping-si-kao-edward-de-bono">
          <div class="book-main">
            <div class="book-title"><a href="books/2026/shui-ping-si-kao-edward-de-bono/summary.html">水平思考</a></div>
            <div class="book-meta">2026 · 爱德华·德博诺（Edward de Bono） · 2026-05-18</div>
            <div class="book-links"><a href="books/2026/shui-ping-si-kao-edward-de-bono/summary.html">HTML 阅读</a> · <a href="books/2026/shui-ping-si-kao-edward-de-bono/summary.md">Markdown</a></div>
          </div>
          <div class="book-actions">
            <button type="button" data-status="done">已读完</button>
            <button type="button" data-status="reviewed">已复盘</button>
          </div>
        </article>
      </div>
    </section>
  </main>
  <script>
    const STORAGE_KEY = 'reading-notes-status-v1';
    const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    function paint(card, status) {
      card.classList.remove('done','reviewed');
      card.classList.add(status || 'done');
      card.querySelectorAll('button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === (status || 'done'));
      });
    }
    document.querySelectorAll('.book-card').forEach(card => {
      const key = card.dataset.key;
      paint(card, state[key] || 'done');
      card.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          state[key] = btn.dataset.status;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          paint(card, state[key]);
        });
      });
    });
  </script>
</body>
</html>
